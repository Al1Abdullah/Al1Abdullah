<svg width="1456" height="816" viewBox="0 0 1456 816" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Base background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#030B0D"/>
      <stop offset="55%" stop-color="#081010"/>
      <stop offset="100%" stop-color="#35542C"/>
    </linearGradient>

    <!-- Brick pattern for left side texture -->
    <pattern id="brickPattern" width="116" height="58" patternUnits="userSpaceOnUse">
      <rect width="116" height="58" fill="none"/>
      <path d="M0 0 H116 M0 29 H116 M0 58 H116" stroke="#35542C" stroke-width="1.5" opacity="0.35"/>
      <path d="M58 0 V29 M0 29 V58 M116 29 V58" stroke="#35542C" stroke-width="1.5" opacity="0.35"/>
    </pattern>

    <!-- Fade mask so the brick pattern fades out toward the right -->
    <linearGradient id="brickFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="brickMask">
      <rect width="1456" height="816" fill="url(#brickFade)"/>
    </mask>

    <!-- Spotlight glow behind the GitHub icon -->
    <radialGradient id="spotlight" cx="50%" cy="35%" r="60%">
      <stop offset="0%"  stop-color="#C2C2BD" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#AEB06F" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#AEB06F" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip path for profile photo -->
    <clipPath id="profileClip">
      <rect x="1004" y="222" width="452" height="660" rx="46" ry="46"/>
    </clipPath>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1456" height="816" fill="url(#bgGradient)"/>
  <rect width="1456" height="816" fill="url(#brickPattern)" mask="url(#brickMask)"/>

  <!-- ===== SPOTLIGHT BEHIND GITHUB ICON ===== -->
  <ellipse cx="1090" cy="170" rx="430" ry="430" fill="url(#spotlight)"/>

  <!-- ===== GITHUB OCTOCAT ICON ===== -->
  <g transform="translate(1090,175)">
    <circle r="155" fill="#030B0D"/>
    <!-- ears -->
    <path d="M-95,-95 L-35,-55 L-60,5 Z" fill="#C2C2BD"/>
    <path d="M95,-95 L35,-55 L60,5 Z" fill="#C2C2BD"/>
    <!-- head / body -->
    <path d="M0,-70
             C70,-70 110,-25 110,35
             C110,100 70,135 0,135
             C-70,135 -110,100 -110,35
             C-110,-25 -70,-70 0,-70 Z" fill="#C2C2BD"/>
    <!-- eyes (cut-outs) -->
    <ellipse cx="-38" cy="10" rx="20" ry="26" fill="#030B0D"/>
    <ellipse cx="38" cy="10" rx="20" ry="26" fill="#030B0D"/>
    <!-- paw -->
    <path d="M-150,60
             C-150,40 -130,30 -110,40
             C-95,48 -90,70 -100,85
             C-115,108 -150,95 -150,60 Z" fill="#C2C2BD"/>
    <circle cx="-138" cy="55" r="6" fill="#030B0D"/>
    <circle cx="-122" cy="48" r="6" fill="#030B0D"/>
    <circle cx="-128" cy="68" r="6" fill="#030B0D"/>
  </g>

  <!-- ===== PROFILE IMAGE ===== -->
  <g>
    <rect x="998" y="216" width="464" height="672" rx="50" ry="50" fill="#030B0D" stroke="#C2C2BD" stroke-width="6"/>
    <image href="assets/profile.png" x="1004" y="222" width="452" height="660"
           preserveAspectRatio="xMidYMid slice" clip-path="url(#profileClip)"/>
    <rect x="1004" y="222" width="452" height="660" rx="46" ry="46" fill="none" stroke="#C2C2BD" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- ===== FREECODECAMP-STYLE FLAME ICON ===== -->
  <g transform="translate(64,150)" fill="#AEB06F">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700">(</text>
    <path transform="translate(38,-40) scale(0.9)" d="M16 2
             C16 2 26 12 22 24
             C20 30 14 32 12 28
             C18 24 14 18 12 22
             C8 16 14 6 16 2 Z"/>
    <text x="76" y="0" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700">)</text>
  </g>

  <!-- ===== HEADLINE TEXT ===== -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="#C2C2BD">
    <text x="64" y="280" font-size="64">Hi, I'm Ali Abdullah</text>
    <text x="64" y="360" font-size="64">AI Engineering Student</text>
    <text x="64" y="440" font-size="64">Expertise in CV, DL,</text>
    <text x="64" y="520" font-size="64">NLP &amp; LLMs</text>
  </g>

  <!-- ===== WEBSITE / SUBTITLE ===== -->
  <text x="64" y="600" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500" fill="#AEB06F">
    https://al1abdullah.netlify.app/
  </text>

</svg>
