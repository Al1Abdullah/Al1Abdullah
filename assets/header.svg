<svg width="1456" height="816" viewBox="0 0 1456 816" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>

    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#030B0D"/>
      <stop offset="55%" stop-color="#081010"/>
      <stop offset="100%" stop-color="#23381C"/>
    </linearGradient>

    <!-- Soft dot grid texture -->
    <pattern id="dotGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#35542C" opacity="0.55"/>
    </pattern>
    <linearGradient id="dotFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotMask">
      <rect width="1456" height="816" fill="url(#dotFade)"/>
    </mask>

    <!-- Glow behind GitHub icon / photo -->
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#AEB06F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#AEB06F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="photoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#35542C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#35542C" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft shadow for the cut-out photo -->
    <filter id="photoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#030B0D" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <rect width="1456" height="816" fill="url(#bgGradient)"/>
  <rect width="1456" height="816" fill="url(#dotGrid)" mask="url(#dotMask)"/>

  <!-- decorative concentric arcs -->
  <circle cx="1456" cy="0" r="420" fill="none" stroke="#AEB06F" stroke-width="1" opacity="0.12"/>
  <circle cx="1456" cy="0" r="540" fill="none" stroke="#AEB06F" stroke-width="1" opacity="0.08"/>

  <!-- thin divider between text block and photo -->
  <rect x="930" y="90" width="1" height="636" fill="#35542C" opacity="0.45"/>

  <!-- ===================== LEFT TEXT BLOCK ===================== -->
  <g font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif">

    <!-- eyebrow -->
    <text x="84" y="172" font-size="22" font-weight="700" letter-spacing="6" fill="#AEB06F">
      AI ENGINEERING STUDENT
    </text>
    <rect x="84" y="190" width="120" height="4" fill="#AEB06F"/>

    <!-- name -->
    <text x="80" y="305" font-size="104" font-weight="800" letter-spacing="-2" fill="#C2C2BD">
      Ali Abdullah
    </text>

    <!-- bio -->
    <text x="84" y="392" font-size="30" font-weight="400" fill="#C2C2BD" opacity="0.82">
      Specializing in Computer Vision, Deep Learning,
    </text>
    <text x="84" y="436" font-size="30" font-weight="400" fill="#C2C2BD" opacity="0.82">
      Natural Language Processing &amp; LLMs.
    </text>

    <!-- clickable link button -->
    <a href="https://al1abdullah.netlify.app/" xlink:href="https://al1abdullah.netlify.app/" target="_blank" style="cursor:pointer;">
      <rect x="84" y="500" width="520" height="68" rx="34" ry="34"
            fill="#35542C" fill-opacity="0.22" stroke="#AEB06F" stroke-width="2"/>
      <text x="116" y="544" font-size="27" font-weight="600" fill="#C2C2BD">
        al1abdullah.netlify.app
      </text>
      <text x="566" y="544" font-size="27" font-weight="700" fill="#AEB06F" text-anchor="middle">
        &#8594;
      </text>
    </a>
  </g>

  <!-- ===================== GITHUB LOGO ===================== -->
  <ellipse cx="1100" cy="110" rx="170" ry="170" fill="url(#iconGlow)"/>
  <g transform="translate(1100,110)">
    <circle r="82" fill="#030B0D" stroke="#35542C" stroke-width="2"/>
    <g transform="scale(0.6)">
      <!-- ears -->
      <path d="M-95,-95 L-35,-55 L-60,5 Z" fill="#AEB06F"/>
      <path d="M95,-95 L35,-55 L60,5 Z" fill="#AEB06F"/>
      <!-- head / body -->
      <path d="M0,-70
               C70,-70 110,-25 110,35
               C110,100 70,135 0,135
               C-70,135 -110,100 -110,35
               C-110,-25 -70,-70 0,-70 Z" fill="#AEB06F"/>
      <!-- eyes -->
      <ellipse cx="-38" cy="10" rx="20" ry="26" fill="#030B0D"/>
      <ellipse cx="38" cy="10" rx="20" ry="26" fill="#030B0D"/>
      <!-- paw -->
      <path d="M-150,60
               C-150,40 -130,30 -110,40
               C-95,48 -90,70 -100,85
               C-115,108 -150,95 -150,60 Z" fill="#AEB06F"/>
      <circle cx="-138" cy="55" r="6" fill="#030B0D"/>
      <circle cx="-122" cy="48" r="6" fill="#030B0D"/>
      <circle cx="-128" cy="68" r="6" fill="#030B0D"/>
    </g>
  </g>

  <!-- ===================== PROFILE PHOTO (transparent cut-out) ===================== -->
  <ellipse cx="1190" cy="500" rx="280" ry="340" fill="url(#photoGlow)"/>
  <image href="assets/profile.png" x="990" y="166" width="410" height="650"
         preserveAspectRatio="xMidYMax meet" filter="url(#photoShadow)"/>

</svg>
