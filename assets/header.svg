<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <!-- Ambient blur for background blobs -->
    <filter id="amb" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <!-- Photo border glow -->
    <filter id="glow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="0" stdDeviation="5"
                    flood-color="#C2C2BD" flood-opacity="0.45"/>
    </filter>

    <!-- Photo clip path -->
    <clipPath id="pc">
      <rect x="646" y="26" width="228" height="248" rx="11"/>
    </clipPath>

    <!-- Card inner clip for top-edge highlight -->
    <clipPath id="cc">
      <rect x="18" y="18" width="589" height="264" rx="16"/>
    </clipPath>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="900" height="300" fill="#030B0D"/>

  <!-- Ambient colour blobs -->
  <ellipse cx="110" cy="90"  rx="180" ry="130" fill="#35542C" opacity="0.22" filter="url(#amb)"/>
  <ellipse cx="500" cy="290" rx="210" ry="140" fill="#AEB06F" opacity="0.08" filter="url(#amb)"/>
  <ellipse cx="850" cy="60"  rx="120" ry="90"  fill="#35542C" opacity="0.1"  filter="url(#amb)"/>

  <!-- ── GLASS CARD ── -->
  <!-- Card body -->
  <rect x="18" y="18" width="589" height="264" rx="16"
        fill="#C2C2BD" fill-opacity="0.04"/>
  <!-- Card border -->
  <rect x="18" y="18" width="589" height="264" rx="16"
        fill="none" stroke="#C2C2BD" stroke-width="0.9" stroke-opacity="0.20"/>
  <!-- Top edge reflection -->
  <rect x="19" y="19" width="587" height="1.2" rx="1"
        fill="#C2C2BD" fill-opacity="0.28"/>
  <!-- Left edge reflection -->
  <rect x="19" y="19" width="1.2" height="262"
        fill="#C2C2BD" fill-opacity="0.12"/>

  <!-- ── CARD TEXT ── -->
  <!-- Greeting label -->
  <text x="56" y="66"
        font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif"
        font-size="11" font-weight="400" letter-spacing="3.5"
        fill="#AEB06F" fill-opacity="0.72">HI THERE — I'M</text>

  <!-- Name -->
  <text x="54" y="128"
        font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif"
        font-size="52" font-weight="700" letter-spacing="0.5"
        fill="#C2C2BD">Abdullah</text>

  <!-- Role badge -->
  <rect x="54" y="142" width="308" height="33" rx="16.5"
        fill="#35542C" fill-opacity="0.50"
        stroke="#AEB06F" stroke-width="0.85" stroke-opacity="0.55"/>
  <text x="208" y="163"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="11.5" font-weight="600" letter-spacing="2.8"
        fill="#AEB06F" text-anchor="middle">AI ENGINEERING STUDENT</text>

  <!-- Divider -->
  <line x1="54" y1="193" x2="500" y2="193"
        stroke="#35542C" stroke-width="0.9" opacity="0.65"/>

  <!-- Website row -->
  <circle cx="54" cy="215" r="3" fill="#35542C"/>
  <text x="66" y="219"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="10.5" letter-spacing="1.8"
        fill="#AEB06F" fill-opacity="0.72">PORTFOLIO</text>

  <circle cx="54" cy="245" r="3" fill="#AEB06F"/>
  <text x="66" y="249"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="14" font-weight="500" letter-spacing="0.3"
        fill="#C2C2BD">al1abdullah.netlify.app</text>

  <!-- Bottom-right corner dots (decorative) -->
  <circle cx="562" cy="270" r="2.2" fill="#35542C" opacity="0.7"/>
  <circle cx="572" cy="270" r="2.2" fill="#35542C" opacity="0.45"/>
  <circle cx="582" cy="270" r="2.2" fill="#35542C" opacity="0.22"/>

  <!-- ── PHOTO FRAME ── -->
  <!-- Outer glow border -->
  <rect x="636" y="18" width="248" height="264" rx="16"
        fill="none" stroke="#C2C2BD" stroke-width="2.4"
        filter="url(#glow)"/>

  <!-- Photo dark bg -->
  <rect x="646" y="26" width="228" height="248" rx="11"
        fill="#081010"/>

  <!-- Photo -->
  <image
    href="https://raw.githubusercontent.com/Al1Abdullah/Al1Abdullah/main/assets/profile.jpg"
    x="646" y="26" width="228" height="248"
    clip-path="url(#pc)"
    preserveAspectRatio="xMidYMin slice"/>

  <!-- Photo inner border -->
  <rect x="646" y="26" width="228" height="248" rx="11"
        fill="none" stroke="#C2C2BD" stroke-width="1.4" stroke-opacity="0.75"/>

  <!-- Tiny corner accent on photo frame -->
  <rect x="636" y="18" width="18" height="2.5" rx="1.2"
        fill="#AEB06F" opacity="0.6"/>
  <rect x="636" y="18" width="2.5" height="18" rx="1.2"
        fill="#AEB06F" opacity="0.6"/>
</svg>
