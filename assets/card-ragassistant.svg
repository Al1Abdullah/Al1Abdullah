<svg width="100%" viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip_card-ragassistant.svg">
      <rect x="0" y="0" width="600" height="320" rx="20"/>
    </clipPath>
    <filter id="blur_card-ragassistant.svg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <linearGradient id="glass_card-ragassistant.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.015"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#clip_card-ragassistant.svg)">
    <rect x="0" y="0" width="600" height="320" fill="#030B0D"/>
    <circle cx="520" cy="40" r="130" fill="#AEB06F" opacity="0.16" filter="url(#blur_card-ragassistant.svg)"/>
    <circle cx="80" cy="290" r="150" fill="#35542C" opacity="0.35" filter="url(#blur_card-ragassistant.svg)"/>
    <rect x="0" y="0" width="600" height="320" fill="url(#glass_card-ragassistant.svg)"/>
    <rect x="0.75" y="0.75" width="598.5" height="318.5" rx="19.5"
          fill="none" stroke="#AEB06F" stroke-opacity="0.16" stroke-width="1.5"/>

    <text x="576" y="92" text-anchor="end"
          font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800"
          fill="#AEB06F" opacity="0.06">03</text>

    <text x="28" y="40"
          font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700"
          letter-spacing="3" fill="#AEB06F" opacity="0.85">PROJECT 03</text>

    <text x="28" y="74"
          font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700"
          fill="#F2F0E6">RAG Knowledge Assistant</text>

    <line x1="28" y1="90" x2="84" y2="90" stroke="#AEB06F" stroke-opacity="0.5" stroke-width="2"/>

    <text x="28" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9B9B2">A document-grounded chatbot built during my internship</text>
  <text x="28" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9B9B2">at atomcamp. A full retrieval pipeline — ingestion,</text>
  <text x="28" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9B9B2">chunking, Qdrant vector storage, Hugging Face</text>
  <text x="28" y="194" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9B9B2">embeddings, and MMR-based retrieval for diverse,</text>
  <text x="28" y="216" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9B9B2">relevant context across programs and admissions.</text>
  
    <rect x="28" y="274" width="65.6" height="26" rx="13"
        fill="#AEB06F" fill-opacity="0.08" stroke="#AEB06F" stroke-opacity="0.28" stroke-width="1"/>
  <text x="60.8" y="291" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600"
        letter-spacing="0.5" fill="#AEB06F">Python</text>
  <rect x="103.6" y="274" width="85.4" height="26" rx="13"
        fill="#AEB06F" fill-opacity="0.08" stroke="#AEB06F" stroke-opacity="0.28" stroke-width="1"/>
  <text x="146.3" y="291" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600"
        letter-spacing="0.5" fill="#AEB06F">LangChain</text>
  <rect x="199.0" y="274" width="65.6" height="26" rx="13"
        fill="#AEB06F" fill-opacity="0.08" stroke="#AEB06F" stroke-opacity="0.28" stroke-width="1"/>
  <text x="231.8" y="291" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600"
        letter-spacing="0.5" fill="#AEB06F">Qdrant</text>
  <rect x="274.6" y="274" width="72.2" height="26" rx="13"
        fill="#AEB06F" fill-opacity="0.08" stroke="#AEB06F" stroke-opacity="0.28" stroke-width="1"/>
  <text x="310.7" y="291" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600"
        letter-spacing="0.5" fill="#AEB06F">FastAPI</text>
  <rect x="356.8" y="274" width="52.4" height="26" rx="13"
        fill="#AEB06F" fill-opacity="0.08" stroke="#AEB06F" stroke-opacity="0.28" stroke-width="1"/>
  <text x="383.0" y="291" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600"
