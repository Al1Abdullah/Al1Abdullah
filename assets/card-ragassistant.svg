<svg width="100%" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip_card-ragassistant.svg">
      <rect x="0" y="0" width="1200" height="300" rx="22"/>
    </clipPath>
    <filter id="blur_card-ragassistant.svg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <linearGradient id="glass_card-ragassistant.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.015"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#clip_card-ragassistant.svg)">
    <rect x="0" y="0" width="1200" height="300" fill="#030B0D"/>
    <circle cx="1040" cy="50" r="220" fill="#AEB06F" opacity="0.16" filter="url(#blur_card-ragassistant.svg)"/>
    <circle cx="160" cy="280" r="260" fill="#35542C" opacity="0.35" filter="url(#blur_card-ragassistant.svg)"/>
    <rect x="0" y="0" width="1200" height="300" fill="url(#glass_card-ragassistant.svg)"/>
    <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="21.5"
          fill="none" stroke="#AEB06F" stroke-opacity="0.16" stroke-width="1.5"/>

    <text x="1164" y="118" text-anchor="end"
          font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="150" font-weight="800"
          fill="#AEB06F" opacity="0.06">03</text>

    <text x="44" y="48"
          font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700"
          letter-spacing="4" fill="#AEB06F" opacity="0.85">PROJECT 03</text>

    <text x="44" y="92"
          font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700"
          fill="#F2F0E6">RAG Knowledge Assistant</text>

    <line x1="44" y1="112" x2="114" y2="112" stroke="#AEB06F" stroke-opacity="0.5" stroke-width="2"/>

    <text x="44" y="144" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#B9B9B2">A document grounded chatbot I built during my internship at atomcamp. Full RAG pipeline: ingestion,</text>
  <text x="44" y="171" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#B9B9B2">chunking, Qdrant for vector storage, Hugging Face embeddings, and MMR based retrieval to keep the retrieved</text>
  <text x="44" y="198" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#B9B9B2">context diverse and relevant for admissions questions.</text>
  
    <rect x="44" y="236" width="77.6" height="32" rx="16"
        fill="#AEB06F" fill-opacity="0.08" stroke="#AEB06F" stroke-opacity="0.28" stroke-width="1"/>
  <text x="82.8" y="257" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600"
        letter-spacing="0.5" fill="#AEB06F">Python</text>
  <rect x="133.6" y="236" width="100.4" height="32" rx="16"
        fill="#AEB06F" fill-opacity="0.08" stroke="#AEB06F" stroke-opacity="0.28" stroke-width="1"/>
  <text x="183.8" y="257" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600"
        letter-spacing="0.5" fill="#AEB06F">LangChain</text>
  <rect x="246.0" y="236" width="77.6" height="32" rx="16"
        fill="#AEB06F" fill-opacity="0.08" stroke="#AEB06F" stroke-opacity="0.28" stroke-width="1"/>
  <text x="284.8" y="257" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600"
        letter-spacing="0.5" fill="#AEB06F">Qdrant</text>
  <rect x="335.6" y="236" width="85.2" height="32" rx="16"
        fill="#AEB06F" fill-opacity="0.08" stroke="#AEB06F" stroke-opacity="0.28" stroke-width="1"/>
  <text x="378.2" y="257" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600"
        letter-spacing="0.5" fill="#AEB06F">FastAPI</text>
  <rect x="432.8" y="236" width="62.4" height="32" rx="16"
        fill="#AEB06F" fill-opacity="0.08" stroke="#AEB06F" stroke-opacity="0.28" stroke-width="1"/>
  <text x="464.0" y="257" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600"
        letter-spacing="0.5" fill="#AEB06F">Groq</text>
  
